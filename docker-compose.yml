services:
  eseo-app-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eseo-app-backend
    environment:
      - TZ=Europe/Paris
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - COOKIE_ENCRYPTION_KEY=${COOKIE_ENCRYPTION_KEY}
      - DATABASE_URL=sqlite:///./data/edt.db
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      # Mount only data directory (not source code for production)
      - edt-data:/app/data
      # Firebase Admin SDK service-account key (see credentials/README.md) -
      # read-only, mounted at the default FIREBASE_CREDENTIALS_PATH.
      - ./credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      # Published on the host so SWAG - running on a separate machine, see
      # edt-api.subdomain.conf - can reach it over the LAN. Not on the same
      # Docker network/host as SWAG, so no service-name DNS resolution here.
      - 9080:8000
    restart: unless-stopped

volumes:
  edt-data:
    driver: local
