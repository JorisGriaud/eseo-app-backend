services:
  # SWAG - Reverse proxy avec Let's Encrypt
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - URL=${DOMAIN}
      - SUBDOMAINS=edt-api
      - VALIDATION=http
      - EMAIL=${EMAIL}
      - ONLY_SUBDOMAINS=false
      - STAGING=false
    volumes:
      - ./swag/config:/config
      - ./edt-api.subdomain.conf:/config/nginx/proxy-confs/edt-api.subdomain.conf:ro
    ports:
      - 443:443
      - 80:80
    restart: unless-stopped
    networks:
      - edt-network

  eseo-app-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eseo-app-backend
    environment:
      - TZ=Europe/Paris
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - COOKIE_ENCRYPTION_KEY=${COOKIE_ENCRYPTION_KEY}
      - DATABASE_URL=sqlite:///./data/edt.db
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      # Mount only data directory (not source code for production)
      - edt-data:/app/data
      # Firebase Admin SDK service-account key (see credentials/README.md) -
      # read-only, mounted at the default FIREBASE_CREDENTIALS_PATH.
      - ./credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - 9080:8000
    networks:
      - edt-network
    restart: unless-stopped

networks:
  edt-network:
    driver: bridge

volumes:
  edt-data:
    driver: local
