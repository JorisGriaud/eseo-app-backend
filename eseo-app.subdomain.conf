## Version 2026/02/08
# EDT ESEO Backend API - FastAPI reverse proxy configuration
# Place this file in: /config/nginx/proxy-confs/ on the SWAG machine.
# Deployed subdomain: eseo-app.<domaine> (SWAG's SUBDOMAINS must include it).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name eseo-app.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # CORS headers (handled by FastAPI, but nginx can add fallback)
    # add_header Access-Control-Allow-Origin "*" always;
    # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    # add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    location / {
        # Reverse proxy to FastAPI backend, running in its own container on
        # a SEPARATE machine (not the same Docker host/network as SWAG) -
        # replace BACKEND_LAN_IP with that machine's LAN IP (or its
        # Tailscale/VPN IP if the two aren't on the same physical network).
        # Port 9080 matches docker-compose.yml's published host port.
        proxy_pass http://BACKEND_LAN_IP:9080;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for future use if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts - POST /auth/mfa/verify holds the connection open server
        # side while it waits for the user to approve the push notification
        # on their phone (up to 60s, see scraper.complete_mfa), so a 60s
        # read timeout here races that wait and 504s on slower approvals.
        # 120s matches scraper.MFA_SESSION_TIMEOUT.
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint (optional - can be accessed without authentication)
    location = /health {
        proxy_pass http://BACKEND_LAN_IP:9080/;
        # If running locally: proxy_pass http://localhost:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: Allow only local monitoring
        # allow 127.0.0.1;
        # allow 172.16.0.0/12; # Docker networks
        # deny all;
    }

    # API documentation (optional - comment out if you want to hide it in production)
    location /docs {
        proxy_pass http://BACKEND_LAN_IP:9080/docs;
        # If running locally: proxy_pass http://localhost:8000/docs;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://BACKEND_LAN_IP:9080/openapi.json;
        # If running locally: proxy_pass http://localhost:8000/openapi.json;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;

    server_name eseo-app.*;

    return 301 https://$host$request_uri;
}
